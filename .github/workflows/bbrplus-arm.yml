name: bbrplus-arm

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bbrplus-arm.yml'
  # schedule:
  #   - cron: '00 00 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build ARM kernel
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
             binutils-aarch64-linux-gnu \
             bc bison build-essential ca-certificates cpio debhelper dpkg-dev \
             dwarves fakeroot flex gcc-aarch64-linux-gnu git kmod \
             libelf-dev libncurses-dev libssl-dev make patch perl python3 python3-ply \
             rsync wget xz-utils

      - name: Build ARM kernel packages
        run: |
          set -euxo pipefail

          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.191.tar.xz
          tar -xf linux-6.1.191.tar.xz
          cd linux-6.1.191

          patch -p1 < ../convert_official_linux-6.1.x_src_to_bbrplus.patch

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CPU_CORES="${CPU_CORES:-$(nproc)}"

          make defconfig
          scripts/config --set-str LOCALVERSION "-bbrplus"
          scripts/config --enable TCP_CONG_BBR
          scripts/config --enable TCP_CONG_BBRPLUS
          scripts/config --disable DEFAULT_BBR
          scripts/config --enable DEFAULT_BBRPLUS
          scripts/config --set-str DEFAULT_TCP_CONG "bbrplus"
          scripts/config --disable SECURITY_LOCKDOWN_LSM
          scripts/config --disable DEBUG_INFO
          scripts/config --disable MODULE_SIG
          scripts/config --disable SLUB_DEBUG
          make olddefconfig

          grep -E 'CONFIG_(LOCALVERSION|TCP_CONG_BBR|TCP_CONG_BBRPLUS|DEFAULT_BBRPLUS|DEFAULT_TCP_CONG)' .config || true
          KBUILD_DEBARCH=arm64 make deb-pkg -j"$CPU_CORES"

      - name: Move ARM deb packages to publish
        run: |
          set -euxo pipefail
          mkdir -p publish
          find . -maxdepth 1 -type f -name '*.deb' -exec mv -t publish {} +
          test -n "$(find publish -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Push ARM packages to release branch
        run: |
          set -euxo pipefail
          cd publish
          ls -lh
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release-6.1.191-arm64
          git add -A
          git commit -m "bbrplus arm"
          git remote add boxtest "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u boxtest release-6.1.191-arm64
